# ============================================
# Docker Compose - Développement Local
# ============================================
# Usage: docker compose -f docker-compose.yml up -d
#
# Template variables:
#   {{PROJECT_NAME}} - Nom du projet
#   {{BACKEND_PORT}} - Port backend (8000)
#   {{FRONTEND_PORT}} - Port frontend dev (5173)
#   {{HAS_REDIS}} - Si Redis est activé
# ============================================

name: {{PROJECT_NAME}}-dev

services:
  # ==========================================
  # Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME}}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-{{PROJECT_NAME}}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  {{#HAS_REDIS}}
  # ==========================================
  # Redis (Cache & Sessions)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: {{PROJECT_NAME}}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  {{/HAS_REDIS}}

  # ==========================================
  # Backend (build local)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: {{PROJECT_NAME}}-backend
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-{{PROJECT_NAME}}}
      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:{{FRONTEND_PORT}}}
      # Environment
      ENVIRONMENT: development
      DEBUG: "true"
      {{#HAS_REDIS}}
      # Redis
      REDIS_URL: redis://redis:6379/0
      {{/HAS_REDIS}}
    volumes:
      - ./backend:/app
    ports:
      - "{{BACKEND_PORT}}:{{BACKEND_PORT}}"
    depends_on:
      db:
        condition: service_healthy
      {{#HAS_REDIS}}
      redis:
        condition: service_healthy
      {{/HAS_REDIS}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{{BACKEND_PORT}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Frontend (build local)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:{{BACKEND_PORT}}/api
    container_name: {{PROJECT_NAME}}-frontend
    restart: unless-stopped
    ports:
      - "{{FRONTEND_PORT}}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  {{#HAS_REDIS}}
  redis_data:
  {{/HAS_REDIS}}

networks:
  default:
    name: {{PROJECT_NAME}}-network
