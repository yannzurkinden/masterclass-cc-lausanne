# ============================================
# Docker Compose - Deploy Prod (VPS)
# ============================================
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Uses pre-built images from GHCR
# Production-ready configuration
# ============================================

name: {{PROJECT_NAME}}-prod

services:
  # ==========================================
  # Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME}}-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  {{#HAS_REDIS}}
  # ==========================================
  # Redis (Cache & Sessions)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: {{PROJECT_NAME}}-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  {{/HAS_REDIS}}

  # ==========================================
  # Backend (GHCR image)
  # ==========================================
  backend:
    image: ghcr.io/{{GITHUB_ORG}}/{{PROJECT_NAME}}-backend:prod
    container_name: {{PROJECT_NAME}}-backend
    restart: always
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Security
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Environment
      ENVIRONMENT: production
      DEBUG: "false"
      {{#HAS_REDIS}}
      # Redis
      REDIS_URL: ${REDIS_URL}
      {{/HAS_REDIS}}
      {{#HAS_S3}}
      # S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      {{/HAS_S3}}
      {{#HAS_SMTP}}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      {{/HAS_SMTP}}
      {{#HAS_TWILIO}}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      {{/HAS_TWILIO}}
    ports:
      - "{{BACKEND_PORT}}:{{BACKEND_PORT}}"
    networks:
      - internal
      - external
    depends_on:
      db:
        condition: service_healthy
      {{#HAS_REDIS}}
      redis:
        condition: service_healthy
      {{/HAS_REDIS}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{{BACKEND_PORT}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ==========================================
  # Frontend (GHCR image)
  # ==========================================
  frontend:
    image: ghcr.io/{{GITHUB_ORG}}/{{PROJECT_NAME}}-frontend:prod
    container_name: {{PROJECT_NAME}}-frontend
    restart: always
    ports:
      - "{{FRONTEND_PORT}}:80"
    networks:
      - external
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  {{#HAS_REDIS}}
  redis_data:
  {{/HAS_REDIS}}

networks:
  internal:
    internal: true
  external:
    name: {{PROJECT_NAME}}-external
