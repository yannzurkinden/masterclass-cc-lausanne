name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend tests (Python)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{PYTHON_VERSION}}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run backend tests
        working-directory: ./backend
        run: |
          uv sync
          uv run pytest -v --tb=short

      # Frontend tests (if applicable)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "{{NODE_VERSION}}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test --passWithNoTests

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend image
      - name: Backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - name: Frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://{{DOMAIN_DEV}}/api

  deploy:
    name: Deploy to Dev VPS
    runs-on: ubuntu-latest
    needs: build
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Database
          DB_HOST: db
          DB_PORT: 5432
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          DB_NAME: ${{ secrets.DEV_DB_NAME }}
          # Security
          SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}
          CORS_ORIGINS: ${{ secrets.DEV_CORS_ORIGINS }}
          # Redis (optional)
          {{#HAS_REDIS}}
          REDIS_URL: redis://:${{ secrets.DEV_REDIS_PASSWORD }}@redis:6379/0
          {{/HAS_REDIS}}
          # S3 (optional)
          {{#HAS_S3}}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          {{/HAS_S3}}
          # SMTP (optional)
          {{#HAS_SMTP}}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          {{/HAS_SMTP}}
          # Twilio (optional)
          {{#HAS_TWILIO}}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          {{/HAS_TWILIO}}
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          envs: REGISTRY,IMAGE_PREFIX,GITHUB_TOKEN,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,SECRET_KEY,CORS_ORIGINS{{#HAS_REDIS}},REDIS_URL{{/HAS_REDIS}}{{#HAS_S3}},S3_ENDPOINT,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET{{/HAS_S3}}{{#HAS_SMTP}},SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL{{/HAS_SMTP}}{{#HAS_TWILIO}},TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER{{/HAS_TWILIO}}
          script: |
            set -e
            cd {{DEPLOY_PATH}}

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Backup database before deploy
            if docker compose -f docker-compose.dev.yml ps db --status running -q 2>/dev/null; then
              echo "Creating database backup..."
              mkdir -p backups
              docker compose -f docker-compose.dev.yml exec -T db pg_dump -U $DB_USER $DB_NAME > backups/backup-$(date +%Y%m%d-%H%M%S).sql
              # Keep only last 7 days of backups
              find backups -name "backup-*.sql" -mtime +7 -delete
            fi

            # Pull new images
            docker compose -f docker-compose.dev.yml pull

            # Deploy with zero-downtime
            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            # Run migrations
            docker compose -f docker-compose.dev.yml exec -T backend alembic upgrade head

            # Health check
            echo "Waiting for services to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:{{BACKEND_PORT}}/health > /dev/null; then
                echo "Backend is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Health check failed!"
                exit 1
              fi
              echo "Attempt $i/30 - waiting..."
              sleep 10
            done

            # Cleanup old images (keep last 7 days)
            docker image prune -af --filter "until=168h"

            echo "Deployment successful!"
